<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q+Pay Checkout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 90%;
      max-width: 450px;
      background: white;
      padding: 40px 25px;
      text-align: center;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .icon {
      font-size: 50px;
    }

    h1 {
      margin: 15px 0 10px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 25px 0;
    }

    button {
      width: 90%;
      padding: 16px;
      background: #111;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .note {
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon">⚡</div>

    <h1>Q+Pay Checkout</h1>

    <p>Purchase access through Q+Pay.</p>

    <div class="price">
      100,000,000 QU
    </div>

    <p>Approx. $43 USD</p>

    <button id="payButton" onclick="pay()">
      Pay with Q+Pay
    </button>

    <div class="note">
      🔒 Secure payment powered by Q+Pay
    </div>
  </div>

  <script>
    async function pay() {
      const button = document.getElementById("payButton");

      button.disabled = true;
      button.textContent = "Creating invoice...";

      try {
        const response = await fetch("/api/create-invoice", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          }
        });

        const data = await response.json();

        if (data.checkoutUrl) {
          window.location.href = data.checkoutUrl;
        } else {
          throw new Error(data.error || "Unable to create payment.");
        }

      } catch (error) {
        alert(error.message);
        button.disabled = false;
        button.textContent = "Pay with Q+Pay";
      }
    }
  </script>

</body>
</html>
